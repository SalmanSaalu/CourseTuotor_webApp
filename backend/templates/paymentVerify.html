<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: green;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
            }

            .checkmark {
            width: 10rem;
            height: 10rem;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: green;
            stroke-miterlimit: 10;
            margin: 10% auto;
            box-shadow: inset 0px 0px 0px #7ac142;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
            }

            .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
            }

            @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
            }
            @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
            }
            @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 30px #fff;
            }
            }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div style="margin-top: 8rem;">
            <div style="display: flex;justify-content: center;">
                <svg class="checkmark" style="margin:0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/><path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg>

            </div>
            <h3 style="font-family: math;font-size: 35px;;">Payment Completed !</h3>
            {% autoescape off %}  
            <p style="color: grey;margin-top: -31px;">Payment has successfully completed ,
                Go to previous page to register your premium courses
                
            </p>
            {% endautoescape %}

        </div>


    </div>
</body>
</html>
